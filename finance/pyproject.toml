[project]
name = "finance"
version = "0.1.0"
description = "Finance Department Fraud Clearance and Ledger Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro]>=2.3.0",
    "fastavro>=1.9.4",
    "sqlalchemy>=2.0.27",
    "psycopg2-binary>=2.9.9",
    "pytest>=8.0.0",
    "langgraph>=0.0.1",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

