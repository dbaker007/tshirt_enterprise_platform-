apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
  namespace: explorer-zone
  labels:
    app: finance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-service
  template:
    metadata:
      labels:
        app: finance-service
      annotations:
        # Dynamic timestamp annotation forces K8s to reload fresh local bytes on every run!
        platform.dev/compiled-at: "DEPLOYMENT_TIMESTAMP"
    spec:
      containers:
      - name: consumer-worker
        image: tshirt-enterprise-platform/finance-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_HOST
          value: "postgres-service"
        - name: FINANCE_DB_PORT
          value: "5432"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "enterprise-kafka-broker:9092"
        - name: PROJECT_ROOT
          value: "/platform_app"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger-collector:4318/v1/traces"
        - name: SCHEMA_REGISTRY_URL
          value: "http://enterprise-kafka-broker:8081"
