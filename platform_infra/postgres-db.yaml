# platform_infra/postgres-db.yaml
# =========================================================================
# 🗄️ 1. THE HARDWARE STORAGE CLAIM TICKET (PersistentVolumeClaim)
# =========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-storage-claim
  namespace: explorer-zone
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# =========================================================================
# 🏗️ 2. THE PROCESS CONFIGURATION ENGINE (Deployment)
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: explorer-zone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-ledger
  template:
    metadata:
      labels:
        app: postgres-ledger
    spec:
      volumes:
      - name: postgres-data-volume
        persistentVolumeClaim:
          claimName: postgres-storage-claim
      # 🟢 SOLUTION: Expose the config map layout as an immutable virtual script volume
      - name: postgres-init-script-volume
        configMap:
          name: postgres-schema-config
      containers:
      - name: postgres-db
        image: postgres:15-bookworm
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "platform_admin"
        - name: POSTGRES_PASSWORD
          value: "admin_secure_password"
        - name: POSTGRES_DB
          value: "platform_shared_ledger"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-data-volume
          mountPath: /var/lib/postgresql/data/
        # 🟢 SOLUTION: Mount the initialization file straight into the postgres startup entrypoint lifecycle directory!
        - name: postgres-init-script-volume
          mountPath: /docker-entrypoint-initdb.d/

---
# =========================================================================
# 📡 3. THE PERMANENT NETWORK INGRESS ROUTER (Service)
# =========================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: explorer-zone
spec:
  type: ClusterIP
  selector:
    app: postgres-ledger
  ports:
  - port: 5432
    targetPort: 5432
