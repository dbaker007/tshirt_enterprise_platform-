[project]
name = "outbox_daemon"
version = "0.1.0"
description = "Universal transactional platform outbox flusher engine daemon service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.3.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0", 
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "sqlalchemy>=2.0.25",
    "httpx>=0.27.0",
    "confluent-kafka[avro]>=2.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 🟢 FIX: Explicitly map the project root context directly to your src package layout!
[tool.hatch.build.targets.wheel]
packages = ["src/outbox_daemon"]

[tool.hatch.build.targets.wheel.sources]
"src/outbox_daemon" = "outbox_daemon"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
